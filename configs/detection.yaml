# Production YOLOE: 10 catalog classes, 38 target + 25 counter prompts.
catalog_version: objects-v3-10
recognition_context_profile: configs/recognition_context.yaml
model:
  backend: yoloe
  model_id: yoloe-v8s-single.pt
  weights: models/yoloe-v8s-single.pt
  device: auto
  imgsz: 1280
  precision: fp16
  roi_focus: true
  roi_patch_size: 640
  roi_max_patches: 12
  target_phrases:
    1:
    - person
    - seated person
    2:
    - motorcycle
    - motor scooter
    - motorbike
    3:
    - car
    - passenger car
    4:
    - plastic table
    - rectangular plastic table
    - small plastic table
    - plastic folding table
    - low plastic table
    5:
    - plastic chair
    - plastic stool
    - low plastic stool
    - small plastic stool
    - blue plastic stool
    - red plastic stool
    - small red plastic stool
    - small blue plastic stool
    - round plastic stool
    6:
    - street food cart
    - wheeled food vending cart
    - mobile food vending cart
    - fruit food stand
    7:
    - shop sign
    - advertising signboard
    - hanging sign
    - store signboard
    8:
    - utility pole
    - electric pole
    9:
    - tree trunk
    - tree stem
    10:
    - basket of fruit
    - crate of vegetables
    - packaged products
    - fruit crate
    - stacked packaged goods
  counter_phrases:
    folding gate: barrier_gate
    metal gate: barrier_gate
    security gate: barrier_gate
    iron fence: fence
    storefront canopy: canopy
    fabric awning: canopy
    concrete wall: wall
    building column: column
    baby stroller: stroller
    pushchair: stroller
    bicycle: bicycle
    truck: car
    van: car
    traffic sign: traffic_sign
    barrier gate: barrier_gate
    potted plant: potted_plant
    pile of bricks: construction_materials
    sand pile: construction_materials
    styrofoam box: foam_box
    paving slabs: construction_materials
    concrete blocks: construction_materials
    construction debris: construction_materials
    pedal bicycle: bicycle
    metal folding chair: nonplastic_chair
    metal table: nonplastic_table
  cache_text_embeddings: true
  roi_strategy: grid
  roi_overlap: 0.2
  roi_batch_size: 2
  reparameterize: true
classes:
  1:
    name: người
    display_name: Người
    prompt: person . seated person
    aliases:
    - person
    - seated person
    - people
    - pedestrian
    - man
    - woman
    box_threshold: 0.35
    text_threshold: 0.2
    is_small_object: false
    detail: Người đứng, đi hoặc ngồi; không bắt buộc nhìn thấy toàn thân.
  2:
    name: xe máy
    display_name: Xe máy
    prompt: motorcycle . motor scooter
    aliases:
    - motorcycle
    - motor scooter
    - motorbike
    box_threshold: 0.35
    text_threshold: 0.2
    is_small_object: false
    detail: Xe máy có động cơ, kể cả xe tay ga; hai bánh và tay lái không đủ phân
      biệt với xe đạp.
  3:
    box_threshold: 0.35
    text_threshold: 0.2
    is_small_object: false
    name: xe ô tô
    display_name: Xe ô tô
    prompt: car . passenger car
    detail: Ô tô con; bốn bánh và kính chắn gió cũng xuất hiện ở xe tải nên không
      dùng làm điều kiện phân biệt.
    aliases:
    - car
    - passenger car
    - automobile
  4:
    name: bàn nhựa
    display_name: Bàn nhựa
    prompt: plastic table . rectangular plastic table
    aliases:
    - plastic table
    - rectangular plastic table
    - table
    box_threshold: 0.35
    text_threshold: 0.2
    is_small_object: true
    detail: Bàn nhựa, kể cả mặt vuông/chữ nhật; không yêu cầu thấy đủ bốn chân. Chất
      liệu vẫn là dự đoán.
  5:
    name: ghế nhựa
    display_name: Ghế nhựa
    prompt: plastic chair . low plastic stool
    aliases:
    - plastic chair
    - low plastic stool
    - plastic stool
    - chair
    - stool
    box_threshold: 0.3
    text_threshold: 0.2
    is_small_object: true
    detail: Ghế nhựa có tựa và ghế đẩu thấp không tựa; không ràng buộc màu sắc.
  6:
    name: xe hàng rong / xe đẩy bán hàng
    display_name: Xe hàng rong / Xe đẩy bán hàng
    prompt: street food cart . wheeled food vending cart . mobile food vending cart
      . fruit food stand
    aliases:
    - street food cart
    - wheeled food vending cart
    - mobile food vending cart
    - fruit food stand
    - food vending cart
    - food cart
    - vending cart
    - fruit stand
    box_threshold: 0.3
    text_threshold: 0.2
    is_small_object: true
    detail: Xe đẩy/quầy bán hàng di động; bao gồm sạp hàng hoa quả/thực phẩm vỉa hè.
  7:
    name: biển quảng cáo
    display_name: Biển quảng cáo
    prompt: shop sign . advertising signboard . signboard . hanging sign . advertising
      board . motel sign
    aliases:
    - shop sign
    - advertising signboard
    - freestanding advertising board
    - advertising board
    - signboard
    - hanging sign
    - motel sign
    - small sign on tree
    - small sign
    - sign board
    - sign
    - board
    box_threshold: 0.3
    text_threshold: 0.2
    is_small_object: true
    detail: Biển hiệu/quảng cáo gắn mặt tiền, đặt trên đất hoặc treo trên cây/cột.
  8:
    name: cột điện
    display_name: Cột điện
    prompt: utility pole . electric pole with cables . cylindrical concrete utility
      pole . electric pole with tangled wires
    aliases:
    - utility pole
    - electric pole with cables
    - electric pole
    - cylindrical concrete utility pole
    - concrete utility pole
    - electric pole with tangled wires
    - utility pole with transformer
    - cột điện bê tông
    box_threshold: 0.26
    text_threshold: 0.2
    is_small_object: false
    detail: Cột điện bê tông ly tâm hoặc cột thép, có dây điện/cáp viễn thông chằng
      chịt hoặc trạm biến áp; phân biệt rõ với cột nhà, gờ tường phẳng đứng.
  9:
    name: thân cây
    display_name: Thân cây
    prompt: tree trunk . exposed tree trunk
    aliases:
    - tree trunk
    - exposed tree trunk
    - trunk
    box_threshold: 0.05
    text_threshold: 0.2
    is_small_object: false
    detail: Phần thân cây nhìn thấy, kể cả thân nghiêng hoặc màu xám. Prompt không
      bảo đảm loại được box tán lá.
  10:
    name: hàng hóa
    display_name: Hàng hóa
    prompt: basket of fruit . crate of vegetables . fruit basket . stacked packaged
      products . merchandise display
    aliases:
    - basket of fruit
    - crate of vegetables
    - fruit basket
    - stacked packaged products
    - merchandise display
    - basket
    - crate
    - fruit
    - vegetables
    - packaged products
    - merchandise
    - products
    - basket crate
    box_threshold: 0.22
    text_threshold: 0.2
    is_small_object: true
    detail: Nội dung hàng, sản phẩm đóng gói, sọt/thùng hoa quả và cụm trưng bày.
inference:
  mode: full
  nms_iou: 0.5
  enable_counter_checks: true
review_rules:
  weak_pole_tree_policy: true
  weak_trunk_candidates: true
  road_surface_consistency: true
  phrase_review_thresholds:
    stacked packaged goods: 0.45
    packaged products: 0.35
  exclusive_class_overlap: true
  overlap_with_table: true
  contained_in_cart_candidate: true
  motorcycle_bicycle_overlap: true
  table_car_overlap: true
  table_materials_overlap: true
  pole_trunk_overlap: true
  cart_barrier_overlap: true
  cart_car_overlap: true
  cart_motorcycle_overlap: true
  goods_plant_overlap: true
  goods_materials_overlap: true
  goods_chair_overlap: true
  ambiguous_counter_overlap: true
  tree_scope_uncertain: true
  advertising_traffic_overlap: false
  sign_canopy_overlap: false
  pole_tree_counter_overlap: true
  pole_tree_canopy_min_greenness: 12.0
  pole_max_aspect_ratio_non_slender: 2.8
  pole_max_width_non_slender: 55.0
  upright_object_geometry: true
  same_head_counter_policy: stronger
  spatial_context_review: false
  counter_pairs:
    2:
    - - bicycle
      - motorcycle_bicycle_overlap
    4:
    - - car
      - table_car_overlap
    - - construction_materials
      - table_materials_overlap
    - - foam_box
      - table_foam_box_overlap
    5:
    - - foam_box
      - chair_foam_box_overlap
    - - construction_materials
      - chair_materials_overlap
    - - nonplastic_chair
      - chair_nonplastic_overlap
    6:
    - - barrier_gate
      - cart_barrier_overlap
    - - car
      - cart_car_overlap
    - - delivery_vehicle
      - cart_delivery_vehicle_overlap
    - - stroller
      - cart_stroller_overlap
    - - column
      - cart_column_overlap
    - - wall
      - cart_wall_overlap
    - - fence
      - cart_fence_overlap
    8:
    - - tree_trunk
      - pole_tree_counter_overlap
    7:
    - - traffic_sign
      - advertising_traffic_overlap
    - - canopy
      - sign_canopy_overlap
    10:
    - - potted_plant
      - goods_plant_overlap
    - - construction_materials
      - goods_materials_overlap
  public_bench_min_aspect: 1.65
  elongated_seating_min_aspect: 2.8
  elongated_seating_max_score: 0.55
conventions:
  object_ids: IDs 1–10 theo danh mục objects-v3-10; không đọc ID cũ bằng mapping mới.
  sidewalk: Mask/polygon độc lập ngoài danh mục vật thể.
  verification: Prompt, raw_label và giao box không xác minh lớp hoặc hoạt động bán
    hàng.
