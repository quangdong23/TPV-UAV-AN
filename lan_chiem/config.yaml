    is_small_object_group: true
    distractors:
      stroller:
        prompt: baby stroller . stroller . pushchair
        aliases:
        - baby stroller
        - stroller
        - pushchair
      column:
        prompt: building column . concrete wall
        aliases:
        - building column
        - concrete wall
        - wall
      gate:
        prompt: folding gate . barrier gate . security gate . metal gate
        aliases:
        - folding gate
        - barrier gate
        - security gate
        - metal gate
        - gate
  compact_context:
    enabled: false
    class_ids:
    - 7
    - 10
    box_threshold: 0.22
    text_threshold: 0.2
    distractors:
      potted_plant:
        prompt: potted plant
        aliases:
        - potted plant
      construction_materials:
        prompt: construction materials
        aliases:
        - construction materials
  compact_objects:
    enabled: false
    class_ids:
    - 1
    - 2
    - 3
    - 4
    - 5
    box_threshold: 0.25
    text_threshold: 0.2
    distractors:
      bicycle:
        prompt: bicycle
        aliases:
        - bicycle
      delivery_vehicle:
        prompt: truck . van
        aliases:
